<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rings evidence board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<link rel="stylesheet" href="board.css">
<script>
(function () { var m = /[?&]theme=(light|dark)/.exec(location.search); if (m) document.documentElement.setAttribute('data-theme', m[1]); })();
</script>
</head>
<body>
<header class="top">
  <div class="bar">
    <p class="eyebrow">Rings bench <span class="badge" id="badge"></span></p>
    <div class="ctl">
      <label for="pick" class="plabel">Model</label>
      <select id="pick"></select>
      <button class="btn" id="themeBtn" type="button" title="Switch light and dark">Dark</button>
    </div>
  </div>
  <div class="lead">
    <div class="big" aria-live="polite"><span class="num" id="nCaught">0</span><span class="of" id="nCaughtOf">of 20</span><span class="lab">rings caught</span></div>
    <div class="words">
      <p class="headline" id="headline"></p>
      <p class="limit" id="limit"></p>
      <div class="legend" aria-label="Key">
        <span class="k"><i class="sw sw-caught"></i>caught</span>
        <span class="k"><i class="sw sw-missed"></i>missed</span>
        <span class="k"><i class="sw sw-alarm"></i>false alarm</span>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="ringgrid" id="ringGrid" aria-label="IBM's labeled laundering rings"></div>

  <button class="strip" id="strip" type="button" aria-expanded="false" aria-controls="ordWrap"></button>
  <div class="ordwrap" id="ordWrap" hidden>
    <p class="note">The 40 neighborhoods IBM labels ordinary. A red dashed tile is one the model called a ring.</p>
    <div class="ordgrid" id="ordGrid"></div>
  </div>

  <details class="roster" id="roster">
    <summary id="rosterH">The caught rings as cards</summary>
    <div class="cards" id="cards"></div>
  </details>
  <footer class="foot" id="foot"></footer>
</main>

<div class="tray" id="tray" aria-label="Rings caught so far">
  <span class="trayl">Caught <b id="trayN">0</b><span class="trayof" id="trayOf"> of 20</span></span>
  <div class="slots" id="slots"></div>
</div>

<div class="tip" id="tip" hidden></div>

<div class="dlg" id="dlg" hidden>
  <div class="dbox" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="dhead">
      <div><h2 id="dTitle"></h2><p id="dSub" class="dsub"></p></div>
      <button class="btn" id="dClose" type="button">Close</button>
    </div>
    <div class="dbody">
      <div class="dleft">
        <div id="dSvg" class="dsvg"></div>
        <div class="scrub">
          <button class="btn" id="dPlay" type="button">Play</button>
          <input type="range" id="dRange" min="0" max="240" step="1" value="240" aria-label="Time">
          <span class="dtime" id="dTime"></span>
        </div>
        <div class="dticks" id="dTicks"></div>
        <label class="chk" id="dCtxWrap"><input type="checkbox" id="dCtx"> Show the ordinary traffic around it</label>
      </div>
      <div class="dright">
        <div class="dcard" id="dCard"></div>
        <p class="dwhy" id="dWhy"></p>
        <div class="dlist" id="dList"></div>
      </div>
    </div>
  </div>
</div>

<script src="../../../data/slice.js"></script>
<script src="../../../data/units.js"></script>
<script src="../../../data/bench_results.js"></script>
<script src="board.js"></script>
</body>
</html>
